{{- $friends := hugo.Data.friends -}}

{{- if $friends -}}
<div class="friend-wrap">
  {{- range $friends -}}
    <a href="{{ .url }}" rel="noopener nofollow noreferrer" target="_blank" class="friend-item">
      <img class="friend-avatar" src="{{ .image }}" alt="{{ .name }}" loading="lazy" />
      <div class="friend-info">
        <div class="friend-name">{{ .name }}</div>
        <div class="friend-desc">{{ .desc }}</div>
      </div>
    </a>
  {{- end -}}
</div>
{{- else -}}
<p style="color: var(--color-text-tertiary); text-align: center; padding: var(--space-12);">
  还没有小伙伴，快来成为第一个吧！
</p>
{{- end -}}

<style>
.friend-wrap {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-4);
  margin-top: var(--space-8);
}

.friend-item {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-5);
  background: var(--color-bg-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  text-decoration: none;
}

.friend-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px var(--color-shadow-hover);
}

.friend-avatar {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-lg);
  object-fit: cover;
  flex-shrink: 0;
}

.friend-name {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 2px;
}

.friend-desc {
  font-size: var(--text-sm);
  color: var(--color-text-tertiary);
  line-height: 1.4;
}
</style>
