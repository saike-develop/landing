{{- $friends := hugo.Data.friends -}}

{{- if $friends -}}
<div class="friend-wrap">
  {{- range $friends -}}
    <a href="{{ .url }}" rel="noopener nofollow noreferrer" target="_blank" class="friend-item">
      <div class="friend-card-pattern"></div>
      <div class="friend-avatar-wrap">
        <img class="friend-avatar" src="{{ .image }}" alt="{{ .name }}" loading="lazy" />
      </div>
      <div class="friend-info">
        <div class="friend-name">{{ .name }}</div>
        <div class="friend-desc">{{ .desc }}</div>
        <div class="friend-visit">
          <span>Visit</span>
          <i class="fas fa-arrow-right"></i>
        </div>
      </div>
    </a>
  {{- end -}}
</div>
{{- else -}}
<div class="empty-state">
  <i class="fas fa-user-group" style="font-size: 2rem; color: var(--color-text-tertiary); margin-bottom: var(--space-4); display: block;"></i>
  <p>还没有小伙伴，快来成为第一个吧！</p>
</div>
{{- end -}}

<style>
.friend-wrap {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--space-6);
  margin-top: var(--space-8);
}

.friend-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--space-10) var(--space-6) var(--space-6);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  text-decoration: none;
  overflow: hidden;
  transition: transform 0.25s var(--ease-out),
              box-shadow 0.25s var(--ease-out),
              border-color 0.25s ease;
}

.friend-item:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: rgba(37, 99, 235, 0.2);
}

/* Decorative pattern */
.friend-card-pattern {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 80px;
  background:
    radial-gradient(circle at 20% 60%, rgba(37,99,235,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 40%, rgba(124,58,237,0.04) 0%, transparent 50%);
  pointer-events: none;
}

.friend-item:hover .friend-card-pattern {
  background:
    radial-gradient(circle at 20% 60%, rgba(37,99,235,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 40%, rgba(124,58,237,0.07) 0%, transparent 50%);
}

.friend-avatar-wrap {
  position: relative;
  z-index: 1;
  margin-bottom: var(--space-4);
}

.friend-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--color-surface);
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  transition: transform 0.25s var(--ease-out);
}

.friend-item:hover .friend-avatar {
  transform: scale(1.05);
}

.friend-info {
  position: relative;
  z-index: 1;
}

.friend-name {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-1);
  letter-spacing: var(--tracking-tight);
}

.friend-desc {
  font-size: var(--text-sm);
  color: var(--color-text-tertiary);
  line-height: 1.4;
  margin-bottom: var(--space-4);
}

.friend-visit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-tertiary);
  transition: color 0.2s ease;
}

.friend-visit i {
  font-size: 0.7em;
  transition: transform 0.2s ease;
}

.friend-item:hover .friend-visit {
  color: var(--color-blue);
}

.friend-item:hover .friend-visit i {
  transform: translateX(3px);
}
</style>
